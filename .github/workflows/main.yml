          cat << 'EOF' > android/app/src/main/java/com/radioroom/app/RadioRoomWidgetProvider.java
          package com.radioroom.app;

          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.PorterDuff;
          import android.graphics.PorterDuffXfermode;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Log;
          import android.util.SizeF;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.util.HashMap;
          import java.util.Map;

          public class RadioRoomWidgetProvider extends AppWidgetProvider {
              private static final String TAG = "RadioRoomWidget";
              private static final String PREFS_NAME = "radioroom_widget_prefs";
              private static final String PREF_TITLE = "title";
              private static final String PREF_SUBTITLE = "subtitle";
              private static final String PREF_IS_PLAYING = "is_playing";
              private static final String PREF_RECENTS = "recents_json";

              // Cover art, shrunk to <=256px so the RemoteViews bitmap budget is never an issue
              private static Bitmap cachedArtwork = null;
              private static final Map<String, Bitmap> logoBitmapCache = new HashMap<>();

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int widgetId : appWidgetIds) {
                      updateWidget(context, appWidgetManager, widgetId);
                  }
              }

              // Resizing the widget (e.g. 4x2 -> 4x1) re-renders it with the matching layout / background size
              @Override
              public void onAppWidgetOptionsChanged(Context context, AppWidgetManager appWidgetManager, int appWidgetId, Bundle newOptions) {
                  updateWidget(context, appWidgetManager, appWidgetId);
              }

              public static void updatePlaybackState(Context context, String title, String subtitle, boolean isPlaying, Bitmap artwork) {
                  try {
                      SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      SharedPreferences.Editor editor = prefs.edit();
                      if (title != null) editor.putString(PREF_TITLE, title);
                      if (subtitle != null) editor.putString(PREF_SUBTITLE, subtitle);
                      editor.putBoolean(PREF_IS_PLAYING, isPlaying);
                      editor.apply();

                      if (artwork != null) {
                          cachedArtwork = scaleDown(artwork, 256);
                      } else if (!isPlaying) {
                          cachedArtwork = null;
                      }

                      updateAllWidgets(context);
                  } catch (Throwable t) { Log.e(TAG, "updatePlaybackState failed", t); }
              }

              public static void updateRecentsOnly(Context context, String recentsJson) {
                  try {
                      SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      prefs.edit().putString(PREF_RECENTS, recentsJson).apply();
                      updateAllWidgets(context);
                  } catch (Throwable t) { Log.e(TAG, "updateRecentsOnly failed", t); }
              }

              public static void updateAllWidgets(Context context) {
                  try {
                      AppWidgetManager manager = AppWidgetManager.getInstance(context);
                      ComponentName thisWidget = new ComponentName(context, RadioRoomWidgetProvider.class);
                      int[] allWidgetIds = manager.getAppWidgetIds(thisWidget);
                      if (allWidgetIds != null && allWidgetIds.length > 0) {
                          for (int widgetId : allWidgetIds) {
                              updateWidget(context, manager, widgetId);
                          }
                      }
                  } catch (Throwable t) { Log.e(TAG, "updateAllWidgets failed", t); }
              }

              private static void updateWidget(Context context, AppWidgetManager manager, int widgetId) {
                  try {
                      SharedPreferences prefs = context.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      String title = prefs.getString(PREF_TITLE, "Radio Room");
                      String subtitle = prefs.getString(PREF_SUBTITLE, "Ready to Play");
                      boolean isPlaying = prefs.getBoolean(PREF_IS_PLAYING, false);
                      String recentsJson = prefs.getString(PREF_RECENTS, "[]");

                      int widthDp = 250;
                      try {
                          Bundle opts = manager.getAppWidgetOptions(widgetId);
                          if (opts != null) widthDp = opts.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 250);
                      } catch (Throwable ignored) {}
                      if (widthDp < 120) widthDp = 250;

                      RemoteViews views;
                      if (Build.VERSION.SDK_INT >= 31) {
                          // Android 12+: the launcher picks the layout that fits the size the user resized the widget to
                          Map<SizeF, RemoteViews> map = new HashMap<>();
                          map.put(new SizeF(120f, 40f), build(context, true, widthDp, title, subtitle, isPlaying, recentsJson));
                          map.put(new SizeF(120f, 158f), build(context, false, widthDp, title, subtitle, isPlaying, recentsJson));
                          views = new RemoteViews(map);
                      } else {
                          views = build(context, false, widthDp, title, subtitle, isPlaying, recentsJson);
                      }
                      manager.updateAppWidget(widgetId, views);
                  } catch (Throwable t) { Log.e(TAG, "updateWidget failed for id " + widgetId, t); }
              }

              private static RemoteViews build(Context context, boolean compact, int widthDp, String title, String subtitle, boolean isPlaying, String recentsJson) {
                  RemoteViews v = new RemoteViews(context.getPackageName(), compact ? R.layout.radioroom_widget_compact : R.layout.radioroom_widget);
                  float density = context.getResources().getDisplayMetrics().density;

                  // Frosted-glass background built from the cover art (soft blur + dark glass tint + rounded corners)
                  Bitmap bg = null;
                  if (cachedArtwork != null) {
                      float scale = Math.min(density, 1.5f);
                      int w = Math.round(widthDp * scale);
                      int h = Math.round((compact ? 84f : 160f) * scale);
                      bg = buildGlassBackground(cachedArtwork, w, h, 28f * scale);
                  }
                  if (bg != null) v.setImageViewBitmap(R.id.widget_bg, bg);
                  else v.setImageViewResource(R.id.widget_bg, R.drawable.radioroom_widget_bg);

                  String artist = subtitle == null ? "" : subtitle;
                  String station = "";
                  int dot = artist.indexOf('•');
                  if (dot >= 0) {
                      station = artist.substring(dot + 1).trim();
                      artist = artist.substring(0, dot).trim();
                  }
                  v.setTextViewText(R.id.widget_title, title);
                  v.setTextViewText(R.id.widget_subtitle, artist);
                  v.setImageViewResource(R.id.widget_btn_play, isPlaying ? R.drawable.ic_widget_pause : R.drawable.ic_widget_play);

                  if (cachedArtwork != null) {
                      v.setImageViewBitmap(R.id.widget_artwork, getRoundedCornerBitmap(context, cachedArtwork, compact ? 14 : 18));
                  } else {
                      v.setImageViewResource(R.id.widget_artwork, R.mipmap.ic_launcher);
                  }

                  Intent openAppIntent = new Intent(context, MainActivity.class);
                  openAppIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent openAppPending = PendingIntent.getActivity(
                      context, 0, openAppIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );
                  v.setOnClickPendingIntent(R.id.widget_artwork, openAppPending);
                  v.setOnClickPendingIntent(R.id.widget_info_container, openAppPending);

                  v.setOnClickPendingIntent(R.id.widget_btn_prev, PendingIntent.getBroadcast(
                      context, 1, new Intent(context, MediaActionReceiver.class).setAction(MediaNotificationService.ACTION_PREV),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                  v.setOnClickPendingIntent(R.id.widget_btn_play, PendingIntent.getBroadcast(
                      context, 2, new Intent(context, MediaActionReceiver.class).setAction(MediaNotificationService.ACTION_PLAY_PAUSE),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                  v.setOnClickPendingIntent(R.id.widget_btn_next, PendingIntent.getBroadcast(
                      context, 3, new Intent(context, MediaActionReceiver.class).setAction(MediaNotificationService.ACTION_NEXT),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));

                  if (!compact) {
                      int[] slotIds = new int[] {
                          R.id.widget_recent_0, R.id.widget_recent_1, R.id.widget_recent_2, R.id.widget_recent_3, R.id.widget_recent_4
                      };
                      try {
                          JSONArray recents = new JSONArray(recentsJson);
                          for (int i = 0; i < slotIds.length; i++) {
                              int slot = slotIds[i];
                              if (i < recents.length()) {
                                  JSONObject item = recents.getJSONObject(i);
                                  final String stationId = item.optString("id");
                                  String logo = item.optString("logo");

                                  Bitmap logoBmp = getStationLogoBitmap(context, stationId, logo);
                                  if (logoBmp != null) {
                                      v.setImageViewBitmap(slot, getRoundedCornerBitmap(context, logoBmp, 10));
                                  } else {
                                      v.setImageViewResource(slot, R.mipmap.ic_launcher);
                                  }
                                  // The most recent station is the one currently selected: ring it
                                  v.setInt(slot, "setBackgroundResource", i == 0 ? R.drawable.radioroom_widget_slot_active_bg : R.drawable.radioroom_widget_slot_bg);
                                  v.setViewVisibility(slot, View.VISIBLE);

                                  Intent selectIntent = new Intent(context, MediaActionReceiver.class);
                                  selectIntent.setAction(MediaActionReceiver.ACTION_SELECT_STATION);
                                  selectIntent.putExtra(MediaActionReceiver.EXTRA_STATION_ID, stationId);
                                  v.setOnClickPendingIntent(slot, PendingIntent.getBroadcast(
                                      context, 100 + i, selectIntent,
                                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
                              } else {
                                  v.setViewVisibility(slot, View.GONE);
                              }
                          }
                      } catch (Throwable t) { Log.e(TAG, "recents failed", t); }
                  }
                  return v;
              }

              private static Bitmap getStationLogoBitmap(Context context, String id, String logo) {
                  if (id != null && logoBitmapCache.containsKey(id)) {
                      return logoBitmapCache.get(id);
                  }
                  try {
                      // logo is a bundled asset path (img/stations/x.jpg) or a legacy data URI
                      Bitmap bmp = AppImageLoader.load(context, logo);
                      if (bmp != null) {
                          bmp = scaleDown(bmp, 160);
                          if (id != null) logoBitmapCache.put(id, bmp);
                      }
                      return bmp;
                  } catch (Throwable t) {}
                  return null;
              }

              private static Bitmap scaleDown(Bitmap src, int maxSide) {
                  if (src == null) return null;
                  int w = src.getWidth(), h = src.getHeight();
                  int longest = Math.max(w, h);
                  if (longest <= maxSide) return src;
                  float f = maxSide / (float) longest;
                  return Bitmap.createScaledBitmap(src, Math.max(1, Math.round(w * f)), Math.max(1, Math.round(h * f)), true);
              }

              // Average colour of the cover, pushed into a dark, slightly saturated range so white text stays readable.
              // Only this one colour is used (never the cover pixels), so low-resolution art can't look blocky.
              private static int tintFromCover(Bitmap cover) {
                  try {
                      Bitmap s = Bitmap.createScaledBitmap(cover, 8, 8, true);
                      float[] hsv = new float[3];
                      double r = 0, g = 0, b = 0, wsum = 0;
                      for (int y = 0; y < 8; y++) {
                          for (int x = 0; x < 8; x++) {
                              int px = s.getPixel(x, y);
                              android.graphics.Color.colorToHSV(px, hsv);
                              // Favour colourful pixels over white/black backgrounds
                              double wgt = 0.15 + hsv[1] * hsv[2];
                              r += android.graphics.Color.red(px) * wgt;
                              g += android.graphics.Color.green(px) * wgt;
                              b += android.graphics.Color.blue(px) * wgt;
                              wsum += wgt;
                          }
                      }
                      int avg = android.graphics.Color.rgb((int) (r / wsum), (int) (g / wsum), (int) (b / wsum));
                      android.graphics.Color.colorToHSV(avg, hsv);
                      hsv[1] = Math.max(0.35f, Math.min(hsv[1], 0.75f));
                      hsv[2] = Math.max(0.32f, Math.min(hsv[2], 0.55f));
                      return android.graphics.Color.HSVToColor(hsv);
                  } catch (Throwable t) {
                      return 0xFF3A2D5C;
                  }
              }

              // Widgets cannot blur what is behind them, so fake frosted glass: a smooth gradient built from ONE colour
              // taken from the cover, a dark glass tint, a faint top highlight and rounded corners.
              private static Bitmap buildGlassBackground(Bitmap cover, int w, int h, float radiusPx) {
                  try {
                      Bitmap out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(out);

                      int tint = tintFromCover(cover);
                      int dark = android.graphics.Color.rgb(
                          (int) (android.graphics.Color.red(tint) * 0.28f),
                          (int) (android.graphics.Color.green(tint) * 0.28f),
                          (int) (android.graphics.Color.blue(tint) * 0.28f));
                      Paint gp = new Paint(Paint.ANTI_ALIAS_FLAG);
                      gp.setShader(new LinearGradient(0, 0, w, h, tint, dark, Shader.TileMode.CLAMP));
                      c.drawRect(0, 0, w, h, gp);
                      c.drawColor(0x7810101A);

                      Paint hp = new Paint(Paint.ANTI_ALIAS_FLAG);
                      hp.setShader(new LinearGradient(0, 0, 0, h * 0.55f, 0x2AFFFFFF, 0x00FFFFFF, Shader.TileMode.CLAMP));
                      c.drawRect(0, 0, w, h * 0.55f, hp);

                      Bitmap mask = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      new Canvas(mask).drawRoundRect(new RectF(0, 0, w, h), radiusPx, radiusPx, new Paint(Paint.ANTI_ALIAS_FLAG));
                      Paint mp = new Paint(Paint.ANTI_ALIAS_FLAG);
                      mp.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.DST_IN));
                      c.drawBitmap(mask, 0, 0, mp);
                      return out;
                  } catch (Throwable t) {
                      Log.e(TAG, "buildGlassBackground failed", t);
                      return null;
                  }
              }

              private static Bitmap getRoundedCornerBitmap(Context context, Bitmap bitmap, float cornerRadiusDp) {
                  if (bitmap == null) return null;
                  try {
                      float density = context.getResources().getDisplayMetrics().density;
                      float px = cornerRadiusDp * density;
                      Bitmap output = Bitmap.createBitmap(bitmap.getWidth(), bitmap.getHeight(), Bitmap.Config.ARGB_8888);
                      Canvas canvas = new Canvas(output);
                      Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
                      RectF rectF = new RectF(0, 0, bitmap.getWidth(), bitmap.getHeight());
                      canvas.drawRoundRect(rectF, px, px, paint);
                      paint.setXfermode(new PorterDuffXfermode(PorterDuff.Mode.SRC_IN));
                      canvas.drawBitmap(bitmap, 0, 0, paint);
                      return output;
                  } catch (Throwable t) {
                      return bitmap;
                  }
              }
          }
          EOF

      - name: Create AppImageLoader (station logos bundled in assets/public/img)
        run: |
          cat << 'EOF' > android/app/src/main/java/com/radioroom/app/AppImageLoader.java
          package com.radioroom.app;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.util.Base64;
          import java.io.InputStream;

          // Logos used to be inlined as base64 data URIs in index.html (2 MB). They now live in
          // www/img/..., which Capacitor copies to assets/public/img/... This resolves any image
          // reference the web layer hands to native code:
          //   data:image/...;base64,...           -> decoded
          //   img/stations/x.jpg (relative)       -> assets/public/img/stations/x.jpg
          //   https://localhost/img/stations/x.jpg -> same (Capacitor's local origin)
          //   anything else (remote http/https)  -> null (caller downloads it)
          public final class AppImageLoader {
              private AppImageLoader() {}

              public static boolean isLocal(String src) {
                  return assetPath(src) != null;
              }

              public static Bitmap load(Context ctx, String src) {
                  if (src == null) return null;
                  src = src.trim();
                  if (src.isEmpty()) return null;
                  try {
                      if (src.startsWith("data:image")) {
                          int comma = src.indexOf(',');
                          if (comma < 0) return null;
                          byte[] bytes = Base64.decode(src.substring(comma + 1), Base64.DEFAULT);
                          return BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                      }
                      String path = assetPath(src);
                      if (path == null) return null;
                      try (InputStream in = ctx.getAssets().open("public/" + path)) {
                          return BitmapFactory.decodeStream(in);
                      }
                  } catch (Throwable t) {
                      return null;
                  }
              }

              private static String assetPath(String src) {
                  if (src == null) return null;
                  String s = src.trim();
                  if (s.isEmpty() || s.startsWith("data:")) return null;
                  String[] localPrefixes = { "https://localhost/", "http://localhost/", "capacitor://localhost/" };
                  for (String p : localPrefixes) {
                      if (s.startsWith(p)) { s = s.substring(p.length()); return clean(s); }
                  }
                  if (s.contains("://")) return null; // remote URL
                  return clean(s);
              }

              private static String clean(String s) {
                  int q = s.indexOf('?'); if (q >= 0) s = s.substring(0, q);
                  int h = s.indexOf('#'); if (h >= 0) s = s.substring(0, h);
                  while (s.startsWith("./")) s = s.substring(2);
                  while (s.startsWith("/")) s = s.substring(1);
                  if (s.isEmpty() || s.contains("..")) return null;
                  try { s = java.net.URLDecoder.decode(s, "UTF-8"); } catch (Throwable ignored) {}
                  return s;
              }
          }
          EOF

