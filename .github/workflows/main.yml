name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Add Media Support Library to build.gradle
        run: |
          sed -i '/dependencies {/a \    implementation "androidx.media:media:1.7.0"' android/app/build.gradle

      - name: Configure Network Cleartext & Permissions in AndroidManifest.xml
        run: |
          # Allow cleartext (http://) audio streams
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          # Permissions for Audio, WakeLock, ForegroundService, and Notifications
          sed -i '/android.permission.INTERNET/a \    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          
          # Service & Receiver declarations inside <application>
          sed -i '/<\/application>/i \    <service android:name="com.radioroom.app.MediaNotificationService" android:enabled="true" android:exported="false" android:foregroundServiceType="mediaPlayback" />\n    <receiver android:name="com.radioroom.app.MediaActionReceiver" android:enabled="true" android:exported="false" />' android/app/src/main/AndroidManifest.xml

      - name: Create Native Media Notification Service
        run: |
          cat << 'EOF' > android/app/src/main/java/com/radioroom/app/MediaNotificationService.java
          package com.radioroom.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;
          import androidx.media.app.NotificationCompat.MediaStyle;

          public class MediaNotificationService extends Service {
              private static final String CHANNEL_ID = "radioroom_playback_channel";
              private static final int NOTIFICATION_ID = 1001;
              
              public static final String ACTION_START = "com.radioroom.app.START";
              public static final String ACTION_UPDATE = "com.radioroom.app.UPDATE";
              public static final String ACTION_STOP = "com.radioroom.app.STOP";
              
              public static final String ACTION_PLAY_PAUSE = "com.radioroom.app.PLAY_PAUSE";
              public static final String ACTION_PREV = "com.radioroom.app.PREV";
              public static final String ACTION_NEXT = "com.radioroom.app.NEXT";

              public static final String EXTRA_TITLE = "extra_title";
              public static final String EXTRA_SUBTITLE = "extra_subtitle";
              public static final String EXTRA_IS_PLAYING = "extra_is_playing";

              private PowerManager.WakeLock wakeLock;
              private String currentTitle = "RadioRoom";
              private String currentSubtitle = "Live Stream";
              private boolean isPlaying = false;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotificationChannel();
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "RadioRoom:AudioWakeLock");
                          wakeLock.acquire(24 * 60 * 60 * 1000L);
                      }
                  } catch (Exception e) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null) {
                      String action = intent.getAction();
                      if (ACTION_START.equals(action) || ACTION_UPDATE.equals(action)) {
                          if (intent.hasExtra(EXTRA_TITLE)) currentTitle = intent.getStringExtra(EXTRA_TITLE);
                          if (intent.hasExtra(EXTRA_SUBTITLE)) currentSubtitle = intent.getStringExtra(EXTRA_SUBTITLE);
                          if (intent.hasExtra(EXTRA_IS_PLAYING)) isPlaying = intent.getBooleanExtra(EXTRA_IS_PLAYING, true);
                          
                          try {
                              Notification notification = buildNotification();
                              startForeground(NOTIFICATION_ID, notification);
                          } catch (Exception e) {}
                      } else if (ACTION_STOP.equals(action)) {
                          try {
                              stopForeground(true);
                              stopSelf();
                          } catch (Exception e) {}
                      }
                  }
                  return START_STICKY;
              }

              private Notification buildNotification() {
                  Intent openAppIntent = new Intent(this, MainActivity.class);
                  openAppIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentPendingIntent = PendingIntent.getActivity(
                      this, 0, openAppIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent prevPendingIntent = PendingIntent.getBroadcast(
                      this, 1, new Intent(this, MediaActionReceiver.class).setAction(ACTION_PREV),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent playPausePendingIntent = PendingIntent.getBroadcast(
                      this, 2, new Intent(this, MediaActionReceiver.class).setAction(ACTION_PLAY_PAUSE),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent nextPendingIntent = PendingIntent.getBroadcast(
                      this, 3, new Intent(this, MediaActionReceiver.class).setAction(ACTION_NEXT),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  int playPauseIcon = isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play;
                  String playPauseTitle = isPlaying ? "Pause" : "Play";

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle(currentTitle != null ? currentTitle : "RadioRoom")
                      .setContentText(currentSubtitle != null ? currentSubtitle : "Now Playing")
                      .setContentIntent(contentPendingIntent)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setOngoing(isPlaying)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .addAction(android.R.drawable.ic_media_previous, "Previous", prevPendingIntent)
                      .addAction(playPauseIcon, playPauseTitle, playPausePendingIntent)
                      .addAction(android.R.drawable.ic_media_next, "Next", nextPendingIntent)
                      .setStyle(new MediaStyle().setShowActionsInCompactView(0, 1, 2));

                  return builder.build();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "RadioRoom Audio Playback",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Control audio playback in notification panel & lock screen");
                      channel.setShowBadge(false);
                      channel.setSound(null, null);
                      channel.enableVibration(false);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) {
                          nm.createNotificationChannel(channel);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                  } catch (Exception e) {}
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Create Native Media Action Receiver
        run: |
          cat << 'EOF' > android/app/src/main/java/com/radioroom/app/MediaActionReceiver.java
          package com.radioroom.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.webkit.WebView;

          public class MediaActionReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  WebView webView = MainActivity.getAppWebView();
                  if (webView == null) return;

                  if (MediaNotificationService.ACTION_PLAY_PAUSE.equals(action)) {
                      webView.post(() -> webView.evaluateJavascript(
                          "if (typeof togglePlayPause === 'function') togglePlayPause(); else document.getElementById('playBtn').click();", null
                      ));
                  } else if (MediaNotificationService.ACTION_NEXT.equals(action)) {
                      webView.post(() -> webView.evaluateJavascript(
                          "if (typeof nextTrack === 'function') nextTrack(); else document.getElementById('nextBtn').click();", null
                      ));
                  } else if (MediaNotificationService.ACTION_PREV.equals(action)) {
                      webView.post(() -> webView.evaluateJavascript(
                          "if (typeof prevTrack === 'function') prevTrack(); else document.getElementById('prevBtn').click();", null
                      ));
                  }
              }
          }
          EOF

      - name: Patch MainActivity with Normal Status Bar & Media Bridge
        run: |
          cat << 'EOF' > android/app/src/main/java/com/radioroom/app/MainActivity.java
          package com.radioroom.app;

          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static WebView staticWebView;
              private PowerManager.WakeLock wakeLock;

              public static WebView getAppWebView() {
                  return staticWebView;
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Keep normal status bar (NOT fullscreen)
                  // Request Notification Permission on Android 13+
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 101);
                      }
                  }

                  // Acquire WakeLock
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "RadioRoom:KeepAlive");
                          wakeLock.acquire();
                      }
                  } catch (Exception e) {}

                  WebView webView = this.bridge.getWebView();
                  staticWebView = webView;

                  if (webView != null) {
                      WebSettings settings = webView.getSettings();
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      // Allow mixed content so http:// audio streams can play inside the app!
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);

                      webView.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void updateMedia(final String title, final String subtitle, final boolean isPlaying) {
                              try {
                                  Intent serviceIntent = new Intent(MainActivity.this, MediaNotificationService.class);
                                  serviceIntent.setAction(MediaNotificationService.ACTION_UPDATE);
                                  serviceIntent.putExtra(MediaNotificationService.EXTRA_TITLE, title);
                                  serviceIntent.putExtra(MediaNotificationService.EXTRA_SUBTITLE, subtitle);
                                  serviceIntent.putExtra(MediaNotificationService.EXTRA_IS_PLAYING, isPlaying);
                                  ContextCompat.startForegroundService(MainActivity.this, serviceIntent);
                              } catch (Exception e) {}
                          }

                          @JavascriptInterface
                          public void stopMedia() {
                              try {
                                  Intent serviceIntent = new Intent(MainActivity.this, MediaNotificationService.class);
                                  serviceIntent.setAction(MediaNotificationService.ACTION_STOP);
                                  stopService(serviceIntent);
                              } catch (Exception e) {}
                          }
                      }, "AndroidBridge");
                  }
              }

              @Override
              public void onPause() {
                  super.onPause();
                  WebView webView = this.bridge.getWebView();
                  if (webView != null) {
                      webView.onResume();
                  }
              }

              @Override
              public void onStop() {
                  super.onStop();
                  WebView webView = this.bridge.getWebView();
                  if (webView != null) {
                      webView.onResume();
                  }
              }

              @Override
              protected void onDestroy() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                  } catch (Exception e) {}
                  super.onDestroy();
              }
          }
          EOF

      - name: Inject Custom User App Logo
        run: |
          # Remove adaptive-icon XML folder so Android uses our launcher icons directly
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true
          
          python3 - << 'PYEOF'
          import base64, os
          sq_b64 = ""
          rd_b64 = ""
          sq_bytes = base64.b64decode(sq_b64)
          rd_bytes = base64.b64decode(rd_b64)
          folders = ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']
          for f in folders:
              dir_path = os.path.join('android/app/src/main/res', f)
              os.makedirs(dir_path, exist_ok=True)
              with open(os.path.join(dir_path, 'ic_launcher.png'), 'wb') as f_out:
                  f_out.write(sq_bytes)
              with open(os.path.join(dir_path, 'ic_launcher_round.png'), 'wb') as f_out:
                  f_out.write(rd_bytes)
              with open(os.path.join(dir_path, 'ic_launcher_foreground.png'), 'wb') as f_out:
                  f_out.write(sq_bytes)
          print("User custom app icons installed to all mipmap directories successfully!")
          PYEOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioRoom-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
