                                  android:layout_height="wrap_content"
                                  android:layout_marginEnd="44dp"
                                  android:text="Ready to Play"
                                  android:textColor="#C8FFFFFF"
                                  android:textSize="14sp"
                                  android:maxLines="1"
                                  android:ellipsize="end" />

                              <LinearLayout
                                  android:layout_width="match_parent"
                                  android:layout_height="wrap_content"
                                  android:layout_marginTop="6dp"
                                  android:orientation="horizontal"
                                  android:gravity="center_vertical">

                                  <ImageView
                                      android:id="@+id/widget_btn_prev"
                                      android:layout_width="44dp"
                                      android:layout_height="44dp"
                                      android:scaleType="fitCenter"
                                      android:src="@drawable/ic_widget_prev"
                                      android:contentDescription="Previous" />

                                  <ImageView
                                      android:id="@+id/widget_btn_play"
                                      android:layout_width="37dp"
                                      android:layout_height="37dp"
                                      android:layout_marginStart="22dp"
                                      android:layout_marginEnd="22dp"
                                      android:padding="6dp"
                                      android:src="@drawable/ic_widget_play"
                                      android:background="@drawable/radioroom_widget_play_bg"
                                      android:contentDescription="Play/Pause" />

                                  <ImageView
                                      android:id="@+id/widget_btn_next"
                                      android:layout_width="44dp"
                                      android:layout_height="44dp"
                                      android:scaleType="fitCenter"
                                      android:src="@drawable/ic_widget_next"
                                      android:contentDescription="Next" />
                              </LinearLayout>
                          </LinearLayout>
                      </LinearLayout>

                      <ImageView
                          android:layout_width="33dp"
                          android:layout_height="33dp"
                          android:layout_gravity="top|end"
                          android:layout_marginTop="14dp"
                          android:layout_marginEnd="16dp"
                          android:scaleType="fitCenter"
                          android:src="@mipmap/ic_launcher" />
                  </FrameLayout>

                  <LinearLayout
                      android:id="@+id/widget_row_recents"
                      android:layout_width="match_parent"
                      android:layout_height="56dp"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp"
                      android:orientation="horizontal"
                      android:gravity="center_vertical"
                      android:background="@drawable/radioroom_widget_band_bg">

                  <FrameLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1">
                      <ImageView android:id="@+id/widget_recent_0" android:layout_width="46dp" android:layout_height="46dp" android:layout_gravity="center" android:scaleType="centerCrop" android:padding="2dp" android:background="@drawable/radioroom_widget_slot_bg" android:visibility="gone" />
                  </FrameLayout>
                  <FrameLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1">
                      <ImageView android:id="@+id/widget_recent_1" android:layout_width="46dp" android:layout_height="46dp" android:layout_gravity="center" android:scaleType="centerCrop" android:padding="2dp" android:background="@drawable/radioroom_widget_slot_bg" android:visibility="gone" />
                  </FrameLayout>
                  <FrameLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1">
                      <ImageView android:id="@+id/widget_recent_2" android:layout_width="46dp" android:layout_height="46dp" android:layout_gravity="center" android:scaleType="centerCrop" android:padding="2dp" android:background="@drawable/radioroom_widget_slot_bg" android:visibility="gone" />
                  </FrameLayout>
                  <FrameLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1">
                      <ImageView android:id="@+id/widget_recent_3" android:layout_width="46dp" android:layout_height="46dp" android:layout_gravity="center" android:scaleType="centerCrop" android:padding="2dp" android:background="@drawable/radioroom_widget_slot_bg" android:visibility="gone" />
                  </FrameLayout>
                  <FrameLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1">
                      <ImageView android:id="@+id/widget_recent_4" android:layout_width="46dp" android:layout_height="46dp" android:layout_gravity="center" android:scaleType="centerCrop" android:padding="2dp" android:background="@drawable/radioroom_widget_slot_bg" android:visibility="gone" />
                  </FrameLayout>
                  </LinearLayout>
              </LinearLayout>

              <ImageView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitXY"
                  android:src="@drawable/radioroom_glass_stroke" />
          </FrameLayout>
          EOF

