name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Native Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android

      - name: Add Media Support Library to build.gradle
        run: |
          sed -i '/dependencies {/a \    implementation "androidx.media:media:1.7.0"' android/app/build.gradle

      - name: Configure App Name in strings.xml
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Radio Room<\/string>/' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Radio Room<\/string>/' android/app/src/main/res/values/strings.xml

      - name: Configure Network Cleartext & Permissions in AndroidManifest.xml
        run: |
          # Allow cleartext (http://) audio streams
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          # Permissions for Audio, WakeLock, ForegroundService, and Notifications
          sed -i '/android.permission.INTERNET/a \    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml
          
          # Service & Receiver declarations inside <application>
          sed -i '/<\/application>/i \    <service android:name="com.radioroom.app.MediaNotificationService" android:enabled="true" android:exported="true" android:foregroundServiceType="mediaPlayback"><intent-filter><action android:name="android.media.browse.MediaBrowserService" /></intent-filter></service>\n    <receiver android:name="com.radioroom.app.MediaActionReceiver" android:enabled="true" android:exported="false" />\n    <receiver android:name="com.radioroom.app.RadioRoomWidgetProvider" android:label="@string/app_name" android:enabled="true" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/radioroom_widget_info" /></receiver>\n    <meta-data android:name="com.google.android.gms.car.application" android:resource="@xml/automotive_app_desc" />' android/app/src/main/AndroidManifest.xml

      - name: Create Custom Background Media WebView Layout
        run: |
          mkdir -p android/app/src/main/res/layout
          cat << 'EOF' > android/app/src/main/res/layout/capacitor_bridge_layout_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.coordinatorlayout.widget.CoordinatorLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <com.radioroom.app.BackgroundMediaWebView
                  android:id="@+id/webview"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />

          </androidx.coordinatorlayout.widget.CoordinatorLayout>
          EOF
          cp android/app/src/main/res/layout/capacitor_bridge_layout_main.xml android/app/src/main/res/layout/bridge_layout_main.xml

      - name: Create Custom BackgroundMediaWebView Class
        run: |
          cat << 'EOF' > android/app/src/main/java/com/radioroom/app/BackgroundMediaWebView.java
          package com.radioroom.app;

          import android.content.Context;
          import android.util.AttributeSet;
          import android.view.View;
          import com.getcapacitor.CapacitorWebView;

          public class BackgroundMediaWebView extends CapacitorWebView {
              public BackgroundMediaWebView(Context context, AttributeSet attrs) {
                  super(context, attrs);
              }

              @Override
              protected void onWindowVisibilityChanged(int visibility) {
                  // Always report VISIBLE so Chromium never throttles background media or JS timers
                  super.onWindowVisibilityChanged(View.VISIBLE);
              }

              @Override
              protected void onVisibilityChanged(View changedView, int visibility) {
                  super.onVisibilityChanged(changedView, View.VISIBLE);
              }

              @Override
              public void onWindowFocusChanged(boolean hasWindowFocus) {
                  super.onWindowFocusChanged(true);
              }

              @Override
              public boolean hasWindowFocus() {
                  return true;
              }

              @Override
              public int getWindowVisibility() {
                  return View.VISIBLE;
              }

              @Override
              public int getVisibility() {
                  return View.VISIBLE;
              }

              @Override
              public void onPause() {
                  // Prevent Chromium from pausing HTML5 video/audio execution on Activity pause
              }

              @Override
              public void pauseTimers() {
                  // Prevent Capacitor from pausing JavaScript timers when app is backgrounded
              }
          }
          EOF

      - name: Create RadioRoom App Widget Resources and Provider
        run: |
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/layout

          cat << 'EOF' > android/app/src/main/res/xml/radioroom_widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:minResizeWidth="180dp"
              android:minResizeHeight="58dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/radioroom_widget"
              android:previewLayout="@layout/radioroom_widget_preview"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:description="@string/app_name" />
          EOF

          cat << 'EOF' > android/app/src/main/res/xml/automotive_app_desc.xml
          <?xml version="1.0" encoding="utf-8"?>
          <automotiveApp>
              <uses name="media" />
          </automotiveApp>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/radioroom_widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <gradient
                  android:angle="135"
                  android:startColor="#F01E1836"
                  android:endColor="#F00E0E15" />
              <corners android:radius="28dp" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/radioroom_widget_slot_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="#00000000" />
              <corners android:radius="12dp" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/radioroom_widget_play_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#FFFFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_widget_play.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#121214"
                android:pathData="M8,5v14l11,-7z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_widget_pause.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#121214"
                android:pathData="M6,19h4V5H6v14zm8,-14v14h4V5h-4z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_widget_prev.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#E4E4E7"
                android:pathData="M6,6h2v12H6zm3.5,6l8.5,6V6z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_widget_next.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
            <path
                android:fillColor="#E4E4E7"
                android:pathData="M6,18l8.5,-6L6,6v12zM16,6v12h2V6h-2z"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/layout/radioroom_widget.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_root"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <ImageView
                  android:id="@+id/widget_bg"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:scaleType="fitXY"
                  android:src="@drawable/radioroom_widget_bg" />

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:orientation="vertical">

                  <FrameLayout
                      android:layout_width="match_parent"
                      android:layout_height="0dp"
                      android:layout_weight="1">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:paddingStart="16dp"
                          android:paddingEnd="16dp"
                          android:paddingTop="8dp"
                          android:paddingBottom="8dp">

                          <ImageView
