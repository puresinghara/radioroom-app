              private static final String BROWSE_ROOT = "__ROOT__";
              private static final String BROWSE_RECENT = "__RECENT__";
              private static final String BROWSE_THAI = "__THAI__";
              private static final String BROWSE_GLOBAL = "__GLOBAL__";
              private static final String CHANNEL_ID = "radioroom_playback_channel";
              private static final int NOTIFICATION_ID = 1001;
              
              public static final String ACTION_START = "com.radioroom.app.START";
              public static final String ACTION_UPDATE = "com.radioroom.app.UPDATE";
              public static final String ACTION_STOP = "com.radioroom.app.STOP";

              public static final String ACTION_PLAY_PAUSE = "com.radioroom.app.PLAY_PAUSE";
              public static final String ACTION_PREV = "com.radioroom.app.PREV";
              public static final String ACTION_NEXT = "com.radioroom.app.NEXT";

              public static final String EXTRA_TITLE = "extra_title";
              public static final String EXTRA_SUBTITLE = "extra_subtitle";
              public static final String EXTRA_IS_PLAYING = "extra_is_playing";

              // In-memory static field to transfer large artwork WITHOUT Android Binder limit!
              public static volatile String pendingArtworkUrl = "";

              private MediaSessionCompat mediaSession;
              private PowerManager.WakeLock wakeLock;
              private AudioManager audioManager;
              private AudioFocusRequest audioFocusRequest;

              private String currentTitle = "Radio Room";
              private String currentSubtitle = "Live";
              private String currentArtworkUrl = "";
              private Bitmap currentArtworkBitmap = null;
              // false by default: Android Auto can create this service just to browse, before anything plays
              private boolean isPlaying = false;
              // true while playback is paused because of a phone/VoIP call or transient focus loss;
              // in this state we keep our focus request alive so we get AUDIOFOCUS_GAIN afterwards
              private boolean interruptedByCall = false;
              private boolean hasAudioFocus = false;
              private boolean isDucked = false;

              private BroadcastReceiver becomingNoisyReceiver = null;
              private boolean isNoisyReceiverRegistered = false;
              private AudioDeviceCallback audioDeviceCallback = null;
              private boolean isAudioDeviceCallbackRegistered = false;

              private static final String JS_STOP = "(() => { if (typeof window.stopAudio === 'function') window.stopAudio(); else { const a = document.getElementById('audioElement'); if (a) { a.pause(); a.removeAttribute('src'); a.load(); } } })()";
              private static final String JS_PAUSE_FOR_CALL = "(() => { if (typeof window.pauseForInterruption === 'function') window.pauseForInterruption(); else if (typeof window.stopAudio === 'function') window.stopAudio(); })()";
              private static final String JS_RESUME_AFTER_CALL = "(() => { if (typeof window.resumeAfterInterruption === 'function') window.resumeAfterInterruption(); else if (typeof window.startAudio === 'function') window.startAudio(); })()";

              // Call detection via AudioManager mode. Works for cellular AND VoIP calls (LINE, WhatsApp, Messenger)
              // and does not depend on us holding audio focus. Needs no extra permission.
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private boolean modePollRunning = false;
              private int normalModeStreak = 0;
              private static final long MODE_POLL_MS = 1000;
              private final Runnable modePollRunnable = new Runnable() {
                  @Override
                  public void run() {
                      if (!modePollRunning) return;
                      checkCallState();
                      if (isPlaying || interruptedByCall) {
                          mainHandler.postDelayed(this, MODE_POLL_MS);
                      } else {
                          modePollRunning = false;
                      }
                  }
              };

              private final AudioManager.OnAudioFocusChangeListener audioFocusChangeListener = new AudioManager.OnAudioFocusChangeListener() {
                  @Override
                  public void onAudioFocusChange(int focusChange) {
                      Log.d(TAG, "onAudioFocusChange " + focusChange + " isPlaying=" + isPlaying);
                      switch (focusChange) {
                          case AudioManager.AUDIOFOCUS_LOSS:
                              // IMPORTANT: the WebView (Chromium) inside this very app also requests audio focus
                              // when the <audio> element starts, which takes focus from us and lands here as a
                              // permanent LOSS. Stopping on it makes the radio play for a split second and then
                              // stop. So only react when it is really a call; ignore it otherwise and do NOT
                              // re-request focus (that would steal it back and make the WebView pause again).
                              hasAudioFocus = false;
                              if (isPlaying && isInCallMode()) {
                                  pauseForInterruption(true);
                              } else {
                                  focusTakenByOthers = true;
                                  Log.d(TAG, "Permanent focus loss ignored (not a call)");
                              }
                              break;
                          case AudioManager.AUDIOFOCUS_LOSS_TRANSIENT:
                              // Incoming call ringtone, voice assistant, etc.
                              hasAudioFocus = false;
                              if (isPlaying) {
                                  boolean call = isInCallMode();
                                  // A transient loss right after our own request is noise from our own WebView
                                  if (call || System.currentTimeMillis() - lastFocusRequestAt > 3000) {
                                      pauseForInterruption(call);
                                  }
                              }
                              break;
                          case AudioManager.AUDIOFOCUS_LOSS_TRANSIENT_CAN_DUCK:
                              // Navigation prompt / notification sound: lower volume instead of tearing down the stream.
                              // (On Android 8+ the system ducks automatically because setWillPauseWhenDucked(false).)
                              if (isPlaying && !isDucked) {
                                  isDucked = true;
                                  triggerWeb("(() => { if (typeof window.rrDuck === 'function') window.rrDuck(true); })()");
                              }
                              break;
                          case AudioManager.AUDIOFOCUS_GAIN:
                              hasAudioFocus = true;
                              if (isDucked) {
                                  isDucked = false;
                                  triggerWeb("(() => { if (typeof window.rrDuck === 'function') window.rrDuck(false); })()");
                              }
                              if (interruptedByCall && !isInCallMode()) {
                                  resumeAfterInterruption();
                              }
                              break;
                      }
                  }
              };

              private boolean isInCallMode() {
                  try {
                      if (audioManager == null) audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      if (audioManager == null) return false;
                      int mode = audioManager.getMode();
                      // RINGTONE(1), IN_CALL(2), IN_COMMUNICATION(3), CALL_SCREENING(4), CALL_REDIRECT(5), COMMUNICATION_REDIRECT(6)
                      return mode >= AudioManager.MODE_RINGTONE;
                  } catch (Throwable t) {
                      return false;
                  }
              }

              private void checkCallState() {
                  boolean inCall = isInCallMode();
                  if (inCall) {
                      normalModeStreak = 0;
                      if (isPlaying && !interruptedByCall) {
                          Log.d(TAG, "Call detected via audio mode, pausing");
                          pauseForInterruption(true);
                      } else if (interruptedByCall) {
                          pausedByCallMode = true;
                      }
                  } else if (interruptedByCall && pausedByCallMode) {
                      // Only calls resume from here (other interruptions resume on AUDIOFOCUS_GAIN).
                      // Wait ~2s of normal mode so the in-call audio route has been torn down.
                      normalModeStreak++;
                      if (normalModeStreak >= 2) {
                          resumeAfterInterruption();
                      }
                  }
              }

              private void startModePolling() {
                  if (modePollRunning) return;
                  modePollRunning = true;
                  normalModeStreak = 0;
                  mainHandler.postDelayed(modePollRunnable, MODE_POLL_MS);
              }

              private void stopModePolling() {
                  modePollRunning = false;
                  mainHandler.removeCallbacks(modePollRunnable);
              }

              private long interruptedAt = 0;
              private long lastFocusRequestAt = 0;
              private boolean focusTakenByOthers = false; // permanent loss ignored: don't fight for focus again
              private boolean pausedByCallMode = false;

              private void pauseForInterruption(boolean byCallMode) {
                  interruptedByCall = true;
                  pausedByCallMode = byCallMode;
                  interruptedAt = System.currentTimeMillis();
                  normalModeStreak = 0;
                  isPlaying = false;
                  updateMediaSessionState();
                  triggerWeb(JS_PAUSE_FOR_CALL);
                  startModePolling();
              }

              private void resumeAfterInterruption() {
                  if (!interruptedByCall) return;
                  interruptedByCall = false;
                  normalModeStreak = 0;
                  Log.d(TAG, "Interruption over, resuming");
                  triggerWeb(JS_RESUME_AFTER_CALL);
              }

              @Override
              public void onCreate() {
                  super.onCreate();
                  isRunning = true;
                  instance = this;
                  createNotificationChannel();
                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);

                  // Wake lock is acquired only when playback actually starts (see onStartCommand),
                  // not when Android Auto merely binds to browse stations.
                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "RadioRoom:AudioPlaybackWakeLock");
                          wakeLock.setReferenceCounted(false);
                      }
                  } catch (Throwable t) {}

                  becomingNoisyReceiver = new BroadcastReceiver() {
                      @Override
                      public void onReceive(Context context, Intent intent) {
                          if (AudioManager.ACTION_AUDIO_BECOMING_NOISY.equals(intent.getAction())) {
                              interruptedByCall = false;
                              isPlaying = false;
                              updateMediaSessionState();
                              triggerWeb(JS_STOP);
                          }
                      }
                  };

                  try {
                      mediaSession = new MediaSessionCompat(this, "RadioRoomMediaSession");
                      mediaSession.setPlaybackToLocal(AudioManager.STREAM_MUSIC);
                      mediaSession.setActive(true);
                      mediaSession.setCallback(new MediaSessionCompat.Callback() {
                          @Override
                          public void onPlay() {
                              interruptedByCall = false;
                              runJsOrLaunchApp("if (typeof window.startAudio === 'function') window.startAudio(); else document.getElementById('playBtn').click();", null);
                          }

                          @Override
                          public void onPause() {
                              interruptedByCall = false;
                              triggerWeb("if (typeof window.stopAudio === 'function') window.stopAudio(); else document.getElementById('playBtn').click();");
                          }

                          @Override
                          public void onSkipToNext() {
                              triggerWeb("if (typeof window.nextTrack === 'function') window.nextTrack(); else document.getElementById('nextBtn').click();");
                          }

                          @Override
                          public void onSkipToPrevious() {
                              triggerWeb("if (typeof window.prevTrack === 'function') window.prevTrack(); else document.getElementById('prevBtn').click();");
                          }

                          @Override
                          public void onStop() {
                              interruptedByCall = false;
                              triggerWeb("if (typeof window.stopAudio === 'function') window.stopAudio();");
                          }

                          // Android Auto: user tapped a station in the browse list
                          @Override
                          public void onPlayFromMediaId(String mediaId, Bundle extras) {
                              if (mediaId == null || mediaId.startsWith("__")) return;
                              interruptedByCall = false;
                              runJsOrLaunchApp("if (typeof selectStationById === 'function') selectStationById(" + JSONObject.quote(mediaId) + ", true);", mediaId);
                          }

                          // Android Auto / Google Assistant: "Play <station> on Radio Room"
                          @Override
                          public void onPlayFromSearch(String query, Bundle extras) {
                              interruptedByCall = false;
                              String id = findStationIdForQuery(query);
                              if (id != null) {
                                  runJsOrLaunchApp("if (typeof selectStationById === 'function') selectStationById(" + JSONObject.quote(id) + ", true);", id);
                              } else {
                                  runJsOrLaunchApp("if (typeof window.startAudio === 'function') window.startAudio();", null);
                              }
                          }
                      });
                      // Lets Android Auto / MediaBrowser clients connect to this session
                      setSessionToken(mediaSession.getSessionToken());
                  } catch (Throwable t) {
                      Log.e(TAG, "MediaSession init failed", t);
                  }
              }

              // Playback lives in the WebView. If the app UI was never opened (e.g. started from Android Auto
              // straight after boot), try to bring MainActivity up so the WebView exists.
              private boolean runJsOrLaunchApp(String js, @Nullable String stationId) {
                  android.webkit.WebView webView = MainActivity.getAppWebView();
                  if (webView != null) {
                      triggerWeb(js);
                      return true;
                  }
                  try {
                      Intent launch = new Intent(this, MainActivity.class);
                      launch.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                      if (stationId != null) launch.putExtra(MediaActionReceiver.EXTRA_STATION_ID, stationId);
                      startActivity(launch);
                  } catch (Throwable t) {
                      Log.w(TAG, "Cannot launch app from background", t);
                  }
                  return false;
              }

              @Nullable
              private String findStationIdForQuery(@Nullable String query) {
                  JSONArray stations = loadStations();
                  if (stations.length() == 0) return null;
                  if (query == null || query.trim().isEmpty()) {
                      // Empty query = "play Radio Room": resume most recent station
                      JSONArray recents = loadRecents();
                      if (recents.length() > 0) return recents.optJSONObject(0).optString("id", null);
                      return stations.optJSONObject(0).optString("id", null);
                  }
                  String q = query.toLowerCase().replaceAll("[^\\p{L}\\p{N}]", "");
                  for (int i = 0; i < stations.length(); i++) {
                      JSONObject s = stations.optJSONObject(i);
                      if (s == null) continue;
                      String name = s.optString("name", "").toLowerCase().replaceAll("[^\\p{L}\\p{N}]", "");
                      if (!name.isEmpty() && (name.contains(q) || q.contains(name))) return s.optString("id", null);
                  }
                  return null;
              }

              private JSONArray loadStations() {
                  try {
                      String json = getSharedPreferences(STATIONS_PREFS, Context.MODE_PRIVATE).getString(PREF_STATIONS, "[]");
                      return new JSONArray(json);
                  } catch (Throwable t) {
                      return new JSONArray();
                  }
              }

              private JSONArray loadRecents() {
                  try {
                      String json = getSharedPreferences("radioroom_widget_prefs", Context.MODE_PRIVATE).getString("recents_json", "[]");
                      return new JSONArray(json);
                  } catch (Throwable t) {
                      return new JSONArray();
                  }
              }

              // ---------- Android Auto browse tree ----------

              @Nullable
              @Override
              public BrowserRoot onGetRoot(@NonNull String clientPackageName, int clientUid, @Nullable Bundle rootHints) {
                  Bundle extras = new Bundle();
                  // Content style hints: show station lists as a grid of logos, categories as list
                  extras.putBoolean("android.media.browse.CONTENT_STYLE_SUPPORTED", true);
                  extras.putInt("android.media.browse.CONTENT_STYLE_BROWSABLE_HINT", 1);
                  extras.putInt("android.media.browse.CONTENT_STYLE_PLAYABLE_HINT", 2);
                  extras.putBoolean("android.media.browse.SEARCH_SUPPORTED", true);
                  return new BrowserRoot(BROWSE_ROOT, extras);
              }

              @Override
              public void onLoadChildren(@NonNull String parentId, @NonNull Result<List<MediaBrowserCompat.MediaItem>> result) {
                  List<MediaBrowserCompat.MediaItem> items = new ArrayList<>();
                  try {
                      if (BROWSE_ROOT.equals(parentId)) {
                          items.add(browsableItem(BROWSE_RECENT, "Recent", "Recently played stations"));
                          items.add(browsableItem(BROWSE_THAI, "Thai Radio", "Stations from Thailand"));
                          items.add(browsableItem(BROWSE_GLOBAL, "Global Radio", "Stations from around the world"));
                      } else if (BROWSE_RECENT.equals(parentId)) {
                          JSONArray recents = loadRecents();
                          JSONArray stations = loadStations();
                          for (int i = 0; i < recents.length(); i++) {
                              JSONObject r = recents.optJSONObject(i);
                              if (r == null) continue;
                              String id = r.optString("id");
                              JSONObject full = findById(stations, id);
                              items.add(playableItem(id, r.optString("name", id), full != null ? full.optString("tagline", "") : ""));
                          }
                      } else if (BROWSE_THAI.equals(parentId) || BROWSE_GLOBAL.equals(parentId)) {
                          String group = BROWSE_THAI.equals(parentId) ? "Thai" : "Global";
                          JSONArray stations = loadStations();
                          for (int i = 0; i < stations.length(); i++) {
                              JSONObject s = stations.optJSONObject(i);
                              if (s == null || !group.equals(s.optString("group"))) continue;
                              items.add(playableItem(s.optString("id"), s.optString("name"), s.optString("tagline", "")));
                          }
                      }
                  } catch (Throwable t) {
                      Log.e(TAG, "onLoadChildren failed", t);
                  }
                  result.sendResult(items);
              }

              @Override
              public void onSearch(@NonNull String query, Bundle extras, @NonNull Result<List<MediaBrowserCompat.MediaItem>> result) {
                  List<MediaBrowserCompat.MediaItem> items = new ArrayList<>();
                  String q = query == null ? "" : query.toLowerCase().trim();
                  JSONArray stations = loadStations();
                  for (int i = 0; i < stations.length(); i++) {
                      JSONObject s = stations.optJSONObject(i);
                      if (s == null) continue;
                      if (q.isEmpty() || s.optString("name").toLowerCase().contains(q)) {
                          items.add(playableItem(s.optString("id"), s.optString("name"), s.optString("tagline", "")));
                      }
                  }
                  result.sendResult(items);
              }

              @Nullable
              private static JSONObject findById(JSONArray arr, String id) {
                  for (int i = 0; i < arr.length(); i++) {
                      JSONObject o = arr.optJSONObject(i);
                      if (o != null && id.equals(o.optString("id"))) return o;
                  }
                  return null;
              }

              private MediaBrowserCompat.MediaItem browsableItem(String id, String title, String subtitle) {
                  MediaDescriptionCompat desc = new MediaDescriptionCompat.Builder()
                      .setMediaId(id).setTitle(title).setSubtitle(subtitle).build();
                  return new MediaBrowserCompat.MediaItem(desc, MediaBrowserCompat.MediaItem.FLAG_BROWSABLE);
              }

              private MediaBrowserCompat.MediaItem playableItem(String id, String title, String subtitle) {
                  MediaDescriptionCompat.Builder b = new MediaDescriptionCompat.Builder()
                      .setMediaId(id).setTitle(title).setSubtitle(subtitle);
                  Bitmap icon = loadStationIcon(id);
                  if (icon != null) b.setIconBitmap(icon);
                  return new MediaBrowserCompat.MediaItem(b.build(), MediaBrowserCompat.MediaItem.FLAG_PLAYABLE);
              }

              // Small (96px) PNG logos written by MainActivity.updateStations(); kept small so the
              // browse result stays well under the 1MB Binder transaction limit
              @Nullable
              private Bitmap loadStationIcon(String id) {
                  try {
                      File f = new File(new File(getFilesDir(), "aa_icons2"), id.replaceAll("[^A-Za-z0-9_-]", "_") + ".png");
                      if (f.exists()) return BitmapFactory.decodeFile(f.getAbsolutePath());
                  } catch (Throwable t) {}
                  return null;
              }

              // Called from MainActivity when the activity is destroyed so the notification never lingers
              // (stopService() alone does not destroy a service that Android Auto is still bound to)
              public static void stopFromApp() {
                  final MediaNotificationService svc = instance;
                  if (svc == null) return;
                  svc.mainHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          svc.handleStop();
                      }
                  });
              }

              private void registerNoisyReceiver() {
                  if (!isNoisyReceiverRegistered && becomingNoisyReceiver != null) {
                      try {
                          IntentFilter filter = new IntentFilter(AudioManager.ACTION_AUDIO_BECOMING_NOISY);
                          if (Build.VERSION.SDK_INT >= 33) {
                              registerReceiver(becomingNoisyReceiver, filter, Context.RECEIVER_EXPORTED);
                          } else {
                              registerReceiver(becomingNoisyReceiver, filter);
                          }
                          isNoisyReceiverRegistered = true;
                      } catch (Throwable t) {}
                  }
                  registerAudioDeviceCallback();
              }

              private void unregisterNoisyReceiver() {
                  if (isNoisyReceiverRegistered && becomingNoisyReceiver != null) {
                      try {
                          unregisterReceiver(becomingNoisyReceiver);
                      } catch (Throwable t) {}
                      isNoisyReceiverRegistered = false;
                  }
                  unregisterAudioDeviceCallback();
              }

              private void registerAudioDeviceCallback() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !isAudioDeviceCallbackRegistered) {
                      try {
                          audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                          if (audioManager != null) {
                              if (audioDeviceCallback == null) {
                                  audioDeviceCallback = new AudioDeviceCallback() {
                                      @Override
                                      public void onAudioDevicesRemoved(AudioDeviceInfo[] removedDevices) {
                                          if (removedDevices != null) {
                                              for (AudioDeviceInfo dev : removedDevices) {
                                                  int t = dev.getType();
                                                  if (t == AudioDeviceInfo.TYPE_USB_DEVICE || 
                                                      t == AudioDeviceInfo.TYPE_USB_HEADSET || 
                                                      t == AudioDeviceInfo.TYPE_WIRED_HEADSET || 
                                                      t == AudioDeviceInfo.TYPE_WIRED_HEADPHONES || 
                                                      t == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP) {
                                                      interruptedByCall = false;
                                                      isPlaying = false;
                                                      updateMediaSessionState();
                                                      triggerWeb(JS_STOP);
                                                      break;
                                                  }
                                              }
                                          }
                                      }
                                  };
                              }
                              audioManager.registerAudioDeviceCallback(audioDeviceCallback, null);
                              isAudioDeviceCallbackRegistered = true;
                          }
                      } catch (Throwable t) {}
                  }
              }

              private void unregisterAudioDeviceCallback() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && isAudioDeviceCallbackRegistered && audioManager != null && audioDeviceCallback != null) {
                      try {
                          audioManager.unregisterAudioDeviceCallback(audioDeviceCallback);
                      } catch (Throwable t) {}
                      isAudioDeviceCallbackRegistered = false;
                  }
              }

              private void requestAudioFocus() {
                  if (hasAudioFocus) return; // already holding it: don't spam requests on every metadata update
                  if (focusTakenByOthers) return; // lost it permanently without a call: don't steal it back mid-playback
                  lastFocusRequestAt = System.currentTimeMillis();
                  try {
                      if (audioManager == null) audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                      if (audioManager != null) {
                          int res;
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              if (audioFocusRequest == null) {
                                  AudioAttributes playbackAttributes = new AudioAttributes.Builder()
                                      .setUsage(AudioAttributes.USAGE_MEDIA)
                                      .setContentType(AudioAttributes.CONTENT_TYPE_MUSIC)
                                      .build();
                                  audioFocusRequest = new AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN)
                                      .setAudioAttributes(playbackAttributes)
                                      .setAcceptsDelayedFocusGain(true)
                                      // false = let the system duck us for nav prompts / notifications
                                      // instead of us tearing down the live stream
                                      .setWillPauseWhenDucked(false)
                                      .setOnAudioFocusChangeListener(audioFocusChangeListener, mainHandler)
                                      .build();
                              }
                              res = audioManager.requestAudioFocus(audioFocusRequest);
                          } else {
                              res = audioManager.requestAudioFocus(audioFocusChangeListener, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN);
                          }
                          hasAudioFocus = (res == AudioManager.AUDIOFOCUS_REQUEST_GRANTED);
                          Log.d(TAG, "requestAudioFocus result=" + res);
                      }
                  } catch (Throwable t) {
                      Log.e(TAG, "requestAudioFocus failed", t);
                  }
              }

              private void abandonAudioFocus() {
                  hasAudioFocus = false;
                  try {
                      if (audioManager != null) {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && audioFocusRequest != null) {
                              audioManager.abandonAudioFocusRequest(audioFocusRequest);
                          } else {
                              audioManager.abandonAudioFocus(audioFocusChangeListener);
                          }
                      }
                  } catch (Throwable t) {}
              }

              private void acquireWakeLock() {
                  try {
                      if (wakeLock != null && !wakeLock.isHeld()) wakeLock.acquire(12 * 60 * 60 * 1000L);
                  } catch (Throwable t) {}
              }

              private void releaseWakeLock() {
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  } catch (Throwable t) {}
              }

              private void handleStop() {
                  isPlaying = false;
                  interruptedByCall = false;
                  stopModePolling();
                  unregisterNoisyReceiver();
                  currentArtworkBitmap = null;
                  currentArtworkUrl = "";
                  pendingArtworkUrl = "";
                  abandonAudioFocus();
                  releaseWakeLock();
                  updateMediaSessionState();
                  try {
                      stopForeground(true);
                      stopSelf();
                  } catch (Throwable t) {}
              }

              private void triggerWeb(final String js) {
                  try {
                      android.webkit.WebView webView = MainActivity.getAppWebView();
                      if (webView != null) {
                          webView.post(new Runnable() {
                              @Override
                              public void run() {
                                  webView.evaluateJavascript(js, null);
                              }
                          });
                      }
                  } catch (Throwable t) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (intent != null) {
                      String action = intent.getAction();
                      if (ACTION_START.equals(action) || ACTION_UPDATE.equals(action)) {
                          if (intent.hasExtra(EXTRA_TITLE)) currentTitle = intent.getStringExtra(EXTRA_TITLE);
                          if (intent.hasExtra(EXTRA_SUBTITLE)) currentSubtitle = intent.getStringExtra(EXTRA_SUBTITLE);
                          boolean wasPlayingBefore = isPlaying;
                          if (intent.hasExtra(EXTRA_IS_PLAYING)) isPlaying = intent.getBooleanExtra(EXTRA_IS_PLAYING, true);
                          // A fresh play (not just a metadata refresh) may ask for focus again
                          if (isPlaying && !wasPlayingBefore) focusTakenByOthers = false;
                          // An "isPlaying=true" metadata update that was already queued when the call started
                          // must not cancel the interruption
                          if (isPlaying && interruptedByCall && System.currentTimeMillis() - interruptedAt < 2000) {
                              isPlaying = false;
                          }

                          // Read artwork from in-memory field to bypass Intent size limits
                          String newArt = pendingArtworkUrl;
                          if (newArt != null && !newArt.isEmpty() && !newArt.equals(currentArtworkUrl)) {
                              currentArtworkUrl = newArt;
                              loadArtwork(currentArtworkUrl);
                          }

                          updateMediaSessionState();
                          // Must become foreground BEFORE requesting focus: on Android 12+ a background
                          // app without a foreground service can be refused audio focus.
                          try {
                              Notification notification = buildNotification();
                              startForeground(NOTIFICATION_ID, notification);
                          } catch (Throwable t) {
                              Log.e(TAG, "startForeground failed", t);
                          }

                          if (isPlaying) {
                              interruptedByCall = false; // user (or resume) started playback again
                              acquireWakeLock();
                              requestAudioFocus();
                              registerNoisyReceiver();
                              startModePolling();
                          } else if (!interruptedByCall) {
                              // Real user pause/stop. While paused for a call we KEEP the focus request so
                              // the system sends AUDIOFOCUS_GAIN when the call ends.
                              unregisterNoisyReceiver();
                              abandonAudioFocus();
                              stopModePolling();
                          }
                      } else if (ACTION_STOP.equals(action)) {
                          handleStop();
                      }
                  }
                  return START_STICKY;
              }

              private void updateMediaSessionState() {
                  if (mediaSession == null) return;
                  try {
                      int state = isPlaying ? PlaybackStateCompat.STATE_PLAYING : PlaybackStateCompat.STATE_PAUSED;
                      long actions = PlaybackStateCompat.ACTION_PLAY
                                   | PlaybackStateCompat.ACTION_PAUSE
                                   | PlaybackStateCompat.ACTION_PLAY_PAUSE
                                   | PlaybackStateCompat.ACTION_SKIP_TO_NEXT
                                   | PlaybackStateCompat.ACTION_SKIP_TO_PREVIOUS
                                   | PlaybackStateCompat.ACTION_STOP
                                   | PlaybackStateCompat.ACTION_PLAY_FROM_MEDIA_ID
                                   | PlaybackStateCompat.ACTION_PLAY_FROM_SEARCH;

                      PlaybackStateCompat.Builder stateBuilder = new PlaybackStateCompat.Builder()
                          .setActions(actions)
                          .setState(state, PlaybackStateCompat.PLAYBACK_POSITION_UNKNOWN, 1.0f);
                      mediaSession.setPlaybackState(stateBuilder.build());

                      String albumName = "Radio Room";
                      if (currentSubtitle != null && currentSubtitle.contains("\u2022")) {
                          albumName = currentSubtitle.substring(currentSubtitle.indexOf("\u2022") + 1).trim();
                      }

                      MediaMetadataCompat.Builder metaBuilder = new MediaMetadataCompat.Builder()
                          .putString(MediaMetadataCompat.METADATA_KEY_TITLE, currentTitle)
                          .putString(MediaMetadataCompat.METADATA_KEY_ARTIST, currentSubtitle)
                          .putString(MediaMetadataCompat.METADATA_KEY_ALBUM, albumName)
                          .putString(MediaMetadataCompat.METADATA_KEY_DISPLAY_TITLE, currentTitle)
                          .putString(MediaMetadataCompat.METADATA_KEY_DISPLAY_SUBTITLE, currentSubtitle);

                      if (currentArtworkBitmap != null) {
                          metaBuilder.putBitmap(MediaMetadataCompat.METADATA_KEY_ALBUM_ART, currentArtworkBitmap);
                          metaBuilder.putBitmap(MediaMetadataCompat.METADATA_KEY_ART, currentArtworkBitmap);
                          metaBuilder.putBitmap(MediaMetadataCompat.METADATA_KEY_DISPLAY_ICON, currentArtworkBitmap);
                      } else {
                          try {
                              Bitmap appBmp = BitmapFactory.decodeResource(getResources(), R.mipmap.ic_launcher);
                              metaBuilder.putBitmap(MediaMetadataCompat.METADATA_KEY_ALBUM_ART, appBmp);
                              metaBuilder.putBitmap(MediaMetadataCompat.METADATA_KEY_ART, appBmp);
                              metaBuilder.putBitmap(MediaMetadataCompat.METADATA_KEY_DISPLAY_ICON, appBmp);
                          } catch (Throwable t) {}
                      }
                      mediaSession.setMetadata(metaBuilder.build());
                  } catch (Throwable t) {}
                  try {
                      RadioRoomWidgetProvider.updatePlaybackState(this, currentTitle, currentSubtitle, isPlaying, currentArtworkBitmap);
                  } catch (Throwable t) {}
              }

              private void loadArtwork(final String artUrl) {
                  if (artUrl == null || artUrl.trim().isEmpty()) return;
                  try {
                      if (artUrl.startsWith("data:image") || AppImageLoader.isLocal(artUrl)) {
                          // Bundled station logo (assets) or legacy data URI
                          {
                              Bitmap bmp = AppImageLoader.load(this, artUrl);
                              if (bmp != null) {
                                  currentArtworkBitmap = bmp;
                                  updateMediaSessionState();
                                  Notification notification = buildNotification();
                                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                                  if (nm != null) {
                                      nm.notify(NOTIFICATION_ID, notification);
                                  }
                              }
                          }
                      } else if (artUrl.startsWith("http://") || artUrl.startsWith("https://")) {
                          new Thread(() -> {
                              try {
                                  URL url = new URL(artUrl);
                                  HttpURLConnection connection = (HttpURLConnection) url.openConnection();
                                  connection.setDoInput(true);
                                  connection.setConnectTimeout(6000);
                                  connection.setReadTimeout(6000);
                                  connection.connect();
                                  InputStream input = connection.getInputStream();
                                  Bitmap bmp = BitmapFactory.decodeStream(input);
                                  if (bmp != null) {
                                      currentArtworkBitmap = bmp;
                                      updateMediaSessionState();
                                      Notification notification = buildNotification();
                                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                                      if (nm != null) {
                                          nm.notify(NOTIFICATION_ID, notification);
                                      }
                                  }
                              } catch (Throwable ignored) {}
                          }).start();
                      }
                  } catch (Throwable ignored) {}
              }

              private Notification buildNotification() {
                  Intent openAppIntent = new Intent(this, MainActivity.class);
                  openAppIntent.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent contentPendingIntent = PendingIntent.getActivity(
                      this, 0, openAppIntent, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent prevPendingIntent = PendingIntent.getBroadcast(
                      this, 1, new Intent(this, MediaActionReceiver.class).setAction(ACTION_PREV),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent playPausePendingIntent = PendingIntent.getBroadcast(
                      this, 2, new Intent(this, MediaActionReceiver.class).setAction(ACTION_PLAY_PAUSE),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  PendingIntent nextPendingIntent = PendingIntent.getBroadcast(
                      this, 3, new Intent(this, MediaActionReceiver.class).setAction(ACTION_NEXT),
                      PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE
                  );

                  int playPauseIcon = isPlaying ? android.R.drawable.ic_media_pause : android.R.drawable.ic_media_play;
                  String playPauseTitle = isPlaying ? "Pause" : "Play";

                  NotificationCompat.Builder builder = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setContentTitle(currentTitle != null ? currentTitle : "Radio Room")
                      .setContentText(currentSubtitle != null ? currentSubtitle : "Now Playing")
                      .setContentIntent(contentPendingIntent)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setOngoing(isPlaying)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .addAction(android.R.drawable.ic_media_previous, "Previous", prevPendingIntent)
                      .addAction(playPauseIcon, playPauseTitle, playPausePendingIntent)
                      .addAction(android.R.drawable.ic_media_next, "Next", nextPendingIntent);

                  if (currentArtworkBitmap != null) {
                      builder.setLargeIcon(currentArtworkBitmap);
                  } else {
                      try {
                          builder.setLargeIcon(BitmapFactory.decodeResource(getResources(), R.mipmap.ic_launcher));
                      } catch (Throwable t) {}
                  }

                  if (mediaSession != null) {
                      builder.setStyle(new MediaStyle()
                          .setMediaSession(mediaSession.getSessionToken())
                          .setShowActionsInCompactView(0, 1, 2)
                      );
                  } else {
                      builder.setStyle(new MediaStyle().setShowActionsInCompactView(0, 1, 2));
                  }

                  return builder.build();
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "Radio Room Audio Playback",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setDescription("Control audio playback in notification panel & lock screen");
                      channel.setShowBadge(false);
                      channel.setSound(null, null);
                      channel.enableVibration(false);
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          nm.createNotificationChannel(channel);
                      }
                  }
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  // The WebView (our player) dies with the task. Stop playback state & notification, but keep
                  // the MediaSession alive: Android Auto may still be bound and would otherwise hold a dead
                  // session. onDestroy() releases it once every client has unbound.
                  handleStop();
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          nm.cancel(NOTIFICATION_ID);
                      }
                  } catch (Throwable t) {}
                  try {
                      RadioRoomWidgetProvider.updatePlaybackState(this, currentTitle, currentSubtitle, false, null);
                  } catch (Throwable t) {}
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  isRunning = false;
                  if (instance == this) instance = null;
                  stopModePolling();
                  unregisterNoisyReceiver();
                  abandonAudioFocus();
                  try {
                      if (mediaSession != null) {
                          mediaSession.setActive(false);
                          mediaSession.release();
                      }
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                      stopForeground(true);
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          nm.cancel(NOTIFICATION_ID);
                      }
                  } catch (Throwable t) {}
                  try {
                      RadioRoomWidgetProvider.updatePlaybackState(this, currentTitle, currentSubtitle, false, null);
                  } catch (Throwable t) {}
                  super.onDestroy();
              }
              // NOTE: do not override onBind(); MediaBrowserServiceCompat returns the browser binder Android Auto needs
          }
          EOF

      - name: Create Native Media Action Receiver
        run: |
          cat << 'EOF' > android/app/src/main/java/com/radioroom/app/MediaActionReceiver.java
          package com.radioroom.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.webkit.WebView;

          public class MediaActionReceiver extends BroadcastReceiver {
              public static final String ACTION_SELECT_STATION = "com.radioroom.app.SELECT_STATION";
              public static final String EXTRA_STATION_ID = "extra_station_id";

              @Override
              public void onReceive(Context context, Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();

                  if (ACTION_SELECT_STATION.equals(action)) {
                      String stationId = intent.getStringExtra(EXTRA_STATION_ID);
                      if (stationId != null && !stationId.isEmpty()) {
                          WebView webView = MainActivity.getAppWebView();
                          if (webView != null) {
                              webView.post(() -> webView.evaluateJavascript(
                                  "if (typeof selectStationById === 'function') selectStationById('" + stationId + "', true);", null
                              ));
                          } else {
                              Intent launchIntent = new Intent(context, MainActivity.class);
                              launchIntent.putExtra(EXTRA_STATION_ID, stationId);
                              launchIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                              context.startActivity(launchIntent);
                          }
                      }
                      return;
                  }

                  WebView webView = MainActivity.getAppWebView();
                  if (webView == null) return;

                  if (MediaNotificationService.ACTION_PLAY_PAUSE.equals(action)) {
                      webView.post(() -> webView.evaluateJavascript(
                          "if (typeof togglePlayPause === 'function') togglePlayPause(); else document.getElementById('playBtn').click();", null
                      ));
                  } else if (MediaNotificationService.ACTION_NEXT.equals(action)) {
                      webView.post(() -> webView.evaluateJavascript(
                          "if (typeof nextTrack === 'function') nextTrack(); else document.getElementById('nextBtn').click();", null
                      ));
                  } else if (MediaNotificationService.ACTION_PREV.equals(action)) {
                      webView.post(() -> webView.evaluateJavascript(
                          "if (typeof prevTrack === 'function') prevTrack(); else document.getElementById('prevBtn').click();", null
                      ));
                  }
              }
          }
          EOF

      - name: Patch MainActivity with Custom WebView & Background Keep-Alive
        run: |
          cat << 'EOF' > android/app/src/main/java/com/radioroom/app/MainActivity.java
          package com.radioroom.app;

          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.view.KeyEvent;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private static WebView staticWebView;
              private PowerManager.WakeLock wakeLock;

              public static WebView getAppWebView() {
                  return staticWebView;
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);

                  if (Build.VERSION.SDK_INT >= 33) {
                      try {
                          if (checkSelfPermission(android.Manifest.permission.POST_NOTIFICATIONS) != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                              requestPermissions(new String[]{android.Manifest.permission.POST_NOTIFICATIONS}, 101);
                          }
                      } catch (Throwable t) {}
                  }

                  try {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      if (pm != null) {
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "RadioRoom:KeepAlive");
                          wakeLock.acquire();
                      }
                  } catch (Throwable t) {}

                  WebView webView = this.bridge.getWebView();
                  staticWebView = webView;
                    handleIntentForStation(getIntent());

                  if (webView != null) {
                      WebSettings settings = webView.getSettings();
                      settings.setMediaPlaybackRequiresUserGesture(false);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setAllowUniversalAccessFromFileURLs(true);
                      settings.setAllowFileAccessFromFileURLs(true);

                      webView.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void updateMedia(final String title, final String subtitle, final boolean isPlaying, final String artworkUrl) {
                              if (!isPlaying && !MediaNotificationService.isRunning) return;
                              try {
                                  MediaNotificationService.pendingArtworkUrl = (artworkUrl != null) ? artworkUrl : "";
                                  Intent serviceIntent = new Intent(MainActivity.this, MediaNotificationService.class);
                                  serviceIntent.setAction(MediaNotificationService.ACTION_UPDATE);
                                  serviceIntent.putExtra(MediaNotificationService.EXTRA_TITLE, title != null ? title : "Radio Room");
                                  serviceIntent.putExtra(MediaNotificationService.EXTRA_SUBTITLE, subtitle != null ? subtitle : "Live");
                                  serviceIntent.putExtra(MediaNotificationService.EXTRA_IS_PLAYING, isPlaying);
                                  ContextCompat.startForegroundService(MainActivity.this, serviceIntent);
                              } catch (Throwable t) {}
                          }

                          @JavascriptInterface
                          public void stopMedia() {
                              try {
                                  MediaNotificationService.pendingArtworkUrl = "";
                                  MediaNotificationService.stopFromApp();
                                  Intent serviceIntent = new Intent(MainActivity.this, MediaNotificationService.class);
                                  serviceIntent.setAction(MediaNotificationService.ACTION_STOP);
                                  stopService(serviceIntent);
                              } catch (Throwable t) {}
                          }

                          // Station catalogue for the Android Auto browse tree.
                          // JSON: [{id,name,tagline,group,logo(data URI)}]. Logos are shrunk to 96px PNG files
                          // so they never go through SharedPreferences or a Binder transaction at full size.
                          @JavascriptInterface
                          public void updateStations(final String stationsJson) {
                              if (stationsJson == null) return;
                              new Thread(() -> {
                                  try {
                                      org.json.JSONArray in = new org.json.JSONArray(stationsJson);
                                      org.json.JSONArray slim = new org.json.JSONArray();
                                      java.io.File dir = new java.io.File(getFilesDir(), "aa_icons2");
                                      if (!dir.exists()) dir.mkdirs();
                                      for (int i = 0; i < in.length(); i++) {
                                          org.json.JSONObject s = in.getJSONObject(i);
                                          String id = s.optString("id");
                                          if (id.isEmpty()) continue;
                                          org.json.JSONObject o = new org.json.JSONObject();
                                          o.put("id", id);
                                          o.put("name", s.optString("name"));
                                          o.put("tagline", s.optString("tagline"));
                                          o.put("group", s.optString("group"));
                                          slim.put(o);
                                          String logo = s.optString("logo");
                                          java.io.File f = new java.io.File(dir, id.replaceAll("[^A-Za-z0-9_-]", "_") + ".png");
                                          if (!f.exists()) {
                                              android.graphics.Bitmap bmp = AppImageLoader.load(MainActivity.this, logo);
                                              if (bmp == null) continue;
                                              // Uniform tile: logo scaled to 96px on an opaque white square, so transparent
                                              // logos don't turn black on the car display and every tile looks the same
                                              android.graphics.Bitmap scaled = android.graphics.Bitmap.createScaledBitmap(bmp, 96, 96, true);
                                              android.graphics.Bitmap small = android.graphics.Bitmap.createBitmap(96, 96, android.graphics.Bitmap.Config.ARGB_8888);
                                              android.graphics.Canvas cv = new android.graphics.Canvas(small);
                                              cv.drawColor(android.graphics.Color.WHITE);
                                              cv.drawBitmap(scaled, 0, 0, null);
                                              try (java.io.FileOutputStream out = new java.io.FileOutputStream(f)) {
                                                  small.compress(android.graphics.Bitmap.CompressFormat.PNG, 100, out);
                                              }
                                          }
                                      }
                                      getSharedPreferences(MediaNotificationService.STATIONS_PREFS, Context.MODE_PRIVATE)
                                          .edit().putString(MediaNotificationService.PREF_STATIONS, slim.toString()).apply();
                                  } catch (Throwable t) {}
                              }).start();
                          }

                          @JavascriptInterface
                          public void updateRecents(final String recentsJson) {
                              if (recentsJson != null) {
                                  try {
                                      RadioRoomWidgetProvider.updateRecentsOnly(MainActivity.this, recentsJson);
                                  } catch (Throwable t) {}
                              }
                          }

                          @JavascriptInterface
                          public String getTsfJazzNowPlaying() {
                              try {
                                  java.net.URL url = new java.net.URL("https://www.tsfjazz.com/player/qect");
                                  java.net.HttpURLConnection conn = (java.net.HttpURLConnection) url.openConnection();
                                  conn.setRequestMethod("POST");
                                  conn.setDoOutput(true);
                                  byte[] postBytes = "x=1".getBytes("UTF-8");
                                  conn.setFixedLengthStreamingMode(postBytes.length);
                                  conn.setConnectTimeout(6000);
                                  conn.setReadTimeout(6000);
                                  conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 10)");
                                  conn.setRequestProperty("Content-Type", "application/x-www-form-urlencoded");
                                  java.io.OutputStream out = conn.getOutputStream();
                                  out.write(postBytes);
                                  out.close();
                                  java.io.BufferedReader in = new java.io.BufferedReader(new java.io.InputStreamReader(conn.getInputStream(), "UTF-8"));
                                  StringBuilder sb = new StringBuilder();
                                  String line;
                                  while ((line = in.readLine()) != null) { sb.append(line); }
                                  in.close();
                                  conn.disconnect();
                                  return sb.toString();
                              } catch (Throwable t) {
                                  return "";
                              }
                          }

                          @JavascriptInterface
                          public void fetchTsfJazzNowPlaying() {
                              // Legacy no-op
                          }
                      }, "AndroidBridge");
                  }
              }

              @Override
              public void setContentView(int layoutResID) {
                  super.setContentView(R.layout.capacitor_bridge_layout_main);
              }

              @Override
              public void onBackPressed() {
                  WebView webView = getAppWebView();
                  if (webView != null) {
                      webView.evaluateJavascript("(() => { const s = document.getElementById('npSheet'); if (s && s.classList.contains('open')) { closeNowPlayingSheet(false); return true; } return false; })()", value -> {
                          if (!"true".equals(value)) {
                              moveTaskToBack(true);
                          }
                      });
                      return;
                  }
                  moveTaskToBack(true);
              }

              @Override
              public void onPause() {
                  super.onPause();
                  WebView webView = getAppWebView();
                  if (webView != null) {
                      webView.onResume();
                      webView.resumeTimers();
                  }
              }

              @Override
              public void onStop() {
                  super.onStop();
                  WebView webView = getAppWebView();
                  if (webView != null) {
                      webView.onResume();
                      webView.resumeTimers();
                  }
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  WebView webView = getAppWebView();
                  if (webView != null) {
                      webView.onResume();
                      webView.resumeTimers();
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleIntentForStation(intent);
              }

              private void handleIntentForStation(Intent intent) {
                  if (intent != null && intent.hasExtra(MediaActionReceiver.EXTRA_STATION_ID)) {
                      final String stationId = intent.getStringExtra(MediaActionReceiver.EXTRA_STATION_ID);
                      if (stationId != null && !stationId.isEmpty()) {
                          final WebView wv = getAppWebView();
                          if (wv != null) {
                              // Page may still be loading on a cold start (widget / Android Auto): retry for ~10s
                              wv.postDelayed(() -> wv.evaluateJavascript(
                                  "(function t(n){ if (typeof selectStationById === 'function') selectStationById(" + org.json.JSONObject.quote(stationId) + ", true); else if (n > 0) setTimeout(function(){ t(n - 1); }, 500); })(20);", null
                              ), 500);
                          }
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  staticWebView = null; // never let the service call into a destroyed WebView
                  try {
                      MediaNotificationService.stopFromApp();
                  } catch (Throwable t) {}
                  try {
                      Intent serviceIntent = new Intent(this, MediaNotificationService.class);
                      serviceIntent.setAction(MediaNotificationService.ACTION_STOP);
                      stopService(serviceIntent);
                  } catch (Throwable t) {}
                  try {
                      if (wakeLock != null && wakeLock.isHeld()) {
                          wakeLock.release();
                      }
                  } catch (Throwable t) {}
                  super.onDestroy();
              }
          }
          EOF

      - name: Generate Custom Launcher Icons
