name: Auto Update YouTube Audio (The Ghost Radio, GUN GUN & CLOUDSPHERE)

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) -> 07:00, 13:00, 19:00, 01:00 เวลาไทย
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

# Never run two updates (or an update and a push from another run) at the same time
concurrency:
  group: update-episodes
  cancel-in-progress: false

jobs:
  update-episodes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run YouTube Audio Scraper
        run: python scripts/update_ghost_episodes.py

      # The app reads ghost_episodes.json (repo root) from GitHub; www/ghost_episodes.json is the copy bundled
      # into the APK. Both are written by the script, so both are committed.
      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ghost_episodes.json www/ghost_episodes.json
          if git diff --staged --quiet; then
            echo "No changes in episodes list."
          else
            git commit -m "Auto-update YouTube Audio episodes (Ghost, Gun Gun, CloudSphere) [skip ci]"
            # main may have moved while the scraper ran (someone pushed): rebase on top, then push, retry a few times
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $i failed, retrying..."
              sleep $((i * 5))
            done
            echo "Could not push after 3 attempts"
            exit 1
          fi
